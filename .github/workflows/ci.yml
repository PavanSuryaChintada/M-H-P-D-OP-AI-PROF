name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A fresh, disposable Postgres for every run — not the project's real
    # Supabase database. pgvector's own image ships the extension this
    # schema needs (knowledge_chunks.embedding); a plain postgres image
    # would fail on `CREATE EXTENSION vector`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Superuser connection — migrations and rls.sql (role/RLS setup) need
      # elevated privileges. Mirrors DATABASE_URL's role in local dev
      # (see lib/db/client.ts and scripts/apply-rls.ts).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # rls.sql deliberately creates app_user with a hardcoded placeholder
      # password ('CHANGE_ME'), never a real one read from the environment
      # (see rls.sql's own comment — that file is committed, so a real
      # secret can never live in it). The "Set app_user password" step below
      # is what makes this URL's password actually work — every actual query
      # in the test suite then connects as this real, RLS-scoped role, the
      # same "never run tests as the superuser" requirement
      # tests/tenancy.test.ts's own comments call out.
      DATABASE_URL_POOLED: postgres://app_user:ci_test_password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Secret scan (doc 23 R5)
        # Fails the build if a pattern matching a real API key shows up in
        # tracked files — Anthropic/OpenAI/Supabase service-role keys, AWS
        # access keys, and generic long hex/base64 secrets assigned to an
        # obviously-sensitive variable name. .env is gitignored and never
        # reaches this checkout at all; this catches the case where someone
        # pastes a real key into a committed file instead (e.g. by accident
        # in a script or a doc).
        run: |
          set -e
          PATTERN='sk-ant-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|eyJhbGciOi[A-Za-z0-9_-]{40,}|SUPABASE_SERVICE_ROLE_KEY=.+[A-Za-z0-9]{20,}'
          MATCHES=$(git grep -InE "$PATTERN" -- . ':!*.lock' ':!package-lock.json' || true)
          if [ -n "$MATCHES" ]; then
            echo "Possible committed secret matched:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No committed-secret patterns found."

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Run migrations
        run: npm run db:migrate

      - name: Apply RLS policies
        run: npm run db:rls

      - name: Set app_user password
        run: psql "$DATABASE_URL" -c "ALTER ROLE app_user PASSWORD 'ci_test_password';"

      - name: Test
        run: npm test
